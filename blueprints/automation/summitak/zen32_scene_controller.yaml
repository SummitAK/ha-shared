          default: []
          selector:
            action: {}
        scene_53:
          name: Big button (button 5) - Pressed 3x
          description: Action to run when button is pressed three times.
          default: []
          selector:
            action: {}
        scene_54:
          name: Big button (button 5) - Pressed 4x
          description: Action to run when button is pressed four times.
          default: []
          selector:
            action: {}
        scene_55:
          name: Big button (button 5) - Pressed 5x
          description: Action to run when button is pressed five times.
          default: []
          selector:
            action: {}
    button2:
      name: Top left button (Zooz button 1, scene 001)
      input:
        scene_1:
          name: Top left button (button 1) - Pressed Once
