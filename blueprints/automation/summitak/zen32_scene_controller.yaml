blueprint:
  name: ZEN32/ZEN35 Scene Controller - buttons and LED tracking v1.3.1
  description: 'Button actions and LED state tracking for Zooz ZEN32 and ZEN35 scene
    controllers (Z-Wave JS). Each of the five buttons runs actions on 1x-5x taps,
    hold and release, and its LED follows a chosen entity (on, off and unavailable
    states, each with its own color and brightness), with an optional night mode.
    Configure other Z-Wave parameters on the device page.


    **Origin:** local fork of rwalker777 "ZEN32 and ZEN35 Scene and State" v2026.9.3.
    Versions below are this fork''s own; they do not track upstream releases.


    **Firmware support:** ZEN32 firmware 3.30-9.x (800LR) and ZEN35 1.40+ use the
    1-10 LED brightness scale; ZEN32 below 3.30, or 10.x (700 series), use the 0-2
    scale.


    **Version:** 1.3.1


    **v1.3.1:** Housekeeping only - no behavior change. File renamed from
    ZEN32-control-track-fix1.yaml to zen32_scene_controller.yaml and the
    "fix1-fix4" change labels replaced by version numbers (fix1 = 1.0.0, fix2 =
    1.1.0, fix3 = 1.2.0, fix3.1 = 1.2.1, fix4 = 1.3.0). Input keys are unchanged,
    so existing automations keep their settings.


    **v1.3.0 (startup guard + breaker fields):** LED and parameter writes wait (up
    to 2 min) until the scene controller is reachable. Z-Wave JS restarts used to
    fire LED updates before the node was loaded, and the resulting "No zwave_js
    nodes found" error is not caught by continue_on_error; if the controller stays
    unreachable the run stops quietly. New Circuit breaker panel / Breaker circuit
    fields, matching the Zooz Smart Switch Suite: stored with the switch''s settings,
    shown in traces and added to the button-press logbook entries. No effect on
    behavior.


    **v1.2.1 (labels):** Button labels use the official Zooz numbering with the
    position first: top left = button 1 (scene 001), top right = 2, bottom left =
    3, bottom right = 4, big button = 5 (scene 005). Upstream labelled the big button
    "button 1" in some places and the hold/multi-tap fields by Zooz scene number in
    others. Labels only - input keys are unchanged.


    **v1.2.0 (reload scope):** Home Assistant''s automation_reloaded event fires when
    ANY automation is saved and does not say which one. The full re-sync of switch
    parameters and LEDs now runs only for the automation that was actually (re)loaded,
    detected by its own entity having been re-added within the last 15 s, so editing
    one controller''s automation no longer re-sends every setting to every other
    controller.


    **v1.1.0 (Z-Wave traffic):** On a tracked-entity change, only the LED parameters
    that actually differ from the previous state are written (typically 1 write instead
    of 3). State updates wait 250 ms and then use the entity''s current state, so rapid
    toggling cannot leave a stale LED state from an older parallel run. Every LED/config
    write uses continue_on_error so one failed Z-Wave write cannot abort the rest of
    the run.


    **v1.0.0 (first local release vs upstream v2026.9.3):** Auto-detect reads the
    device firmware version (Z-Wave JS reports every ZEN32, including 800LR units,
    with model "ZEN32", so model-based detection never selected the 1-10 scale). All
    brightness pickers offer the full 1-10 levels plus Low/Medium/Bright presets;
    on legacy 0-2 firmware levels fold to the nearest step. Night-time "No change"
    brightness is no longer treated as an override. Big-button "Track relay" is honored
    consistently, and its color and brightness are applied when tracking the relay.
    Unknown or out-of-range brightness values fall back to Medium instead of being
    sent raw to the device.

    '
  domain: automation
  source_url: https://github.com/SummitAK/ha-shared/blob/main/blueprints/automation/summitak/zen32_scene_controller.yaml
  homeassistant:
    min_version: 2024.6.0
  input:
    Switch_params:
      name: Switch and Paramters
      input:
        zooz_switch:
          name: Zooz scene controller
          description: List of available Zooz ZEN32 or ZEN35 switches.
          selector:
            device:
              filter:
              - integration: zwave_js
                manufacturer: Zooz
                model: ZEN32
              - integration: zwave_js
                manufacturer: Zooz
                model: ZEN32 800LR
              - integration: zwave_js
                manufacturer: Zooz
                model: ZEN35
              multiple: false
        firmware_version:
          name: Firmware Version
          description: 'Select your device''s firmware version to use correct LED
            brightness scale. Auto-detect reads the firmware version Z-Wave JS reports
            for the device: **ZEN32 3.30-9.x and ZEN35 1.40+** use the 1-10 brightness
            scale. **ZEN32 below 3.30 or 10.x** use the 0-2 scale. Override manually
            only if auto-detect picks the wrong scale.

            '
          default: auto
          selector:
            select:
              mode: dropdown
              options:
              - label: Auto-detect from firmware version (Recommended)
                value: auto
              - label: ZEN32 3.30+ / ZEN35 1.40+ (1-10 scale)
                value: new
              - label: ZEN32 below 3.30 or 10.x (0-2 scale)
                value: legacy
              multiple: false
              custom_value: false
              sort: false
        p19_relay_control:
          name: Parameter 19 - Enable or Disable relay control
          description: Disable for smart bulb mode or if there is no load attached
            to the relay or you want the button to be scene only
          default: '1'
          selector:
            select:
              mode: dropdown
              options:
              - label: Local control disabled (Smart bulb mode)
                value: '0'
              - label: Local and Z-Wave control enabled
                value: '1'
              - label: Local and Z-Wave control disabled
                value: '2'
              multiple: false
              custom_value: false
              sort: false
        p20_relay_led_report:
          name: Parameter 20 - Enable or Disable reporting and LED toggle if relay
            is disabled
          description: It *should* be disabled
          default: '1'
          selector:
            select:
              mode: dropdown
              options:
              - label: Enable
                value: '0'
              - label: Disable
                value: '1'
              multiple: false
              custom_value: false
              sort: false
        turn_off_untracked:
          name: Turn Off Untracked LEDs
          description: If enabled, any scene buttons that do not have a tracked entity
            will have their LEDs permanently turned off (Always Off).
          default: false
          selector:
            boolean: {}
        breaker_panel:
          name: Circuit breaker panel
          description: Electrical documentation - the panel that feeds this switch
            (e.g. "Main" or "Garage sub-panel"). Stored here with the switch's other
            settings for safety lockout reconciliation; no effect on behavior.
          default: ''
          selector:
            text:
              multiline: false
              multiple: false
        breaker_circuit:
          name: Breaker circuit
          description: Electrical documentation - the breaker number in that panel
            (e.g. "7" or "21"). No effect on behavior.
          default: ''
          selector:
            text:
              multiline: false
              multiple: false
    nighttime:
      name: Nighttime settings
      collapsed: true
      input:
        night_entity:
          name: Nighttime State Entity (Optional Override)
          description: Select a toggle (e.g., your input_boolean.night_mode), binary_sensor,
            or sun entity. When 'on' or 'below_horizon', it is Nighttime. If used,
            this OVERRIDES the specific times below.
          default: []
          selector:
            entity:
              multiple: false
              domain:
              - binary_sensor
              - input_boolean
              - sensor
              - sun
              reorder: false
        invert_night_entity:
          name: Invert Night Entity Logic
          description: Enable this if you are using a 'Daytime' entity. It reverses
            the logic so 'on/below_horizon' equals Daytime instead of Nighttime.
          default: false
          selector:
            boolean: {}
        schedule_start:
          name: Night time LEDs start time (Fallback)
          description: LEDs are dimmed or turned off at this time. Used ONLY if no
            Nighttime State Entity is selected above. To disable leave at 00:00:00
            default.
          default: 00:00:00
          selector:
            time: {}
        night_led_brightness:
          name: Night time brightness setting.
          description: Override brightness of LEDs between schedule times or when
            the Night Entity is active. (1-10 on new firmware; folded to Low/Medium/Bright
            on legacy firmware)
          default: '99'
          selector:
            select:
              mode: dropdown
              options:
              - label: No change
                value: '99'
              - label: 1 (dimmest)
                value: '1'
              - label: '2'
                value: '2'
              - label: '3'
                value: '3'
              - label: '4'
                value: '4'
              - label: '5'
                value: '5'
              - label: '6'
                value: '6'
              - label: '7'
                value: '7'
              - label: '8'
                value: '8'
              - label: '9'
                value: '9'
              - label: 10 (brightest)
                value: '10'
              - label: Low preset (3 / legacy low)
                value: low
              - label: Medium preset (6 / legacy medium)
                value: medium
              - label: Bright preset (10 / legacy bright)
                value: bright
              multiple: false
              custom_value: false
              sort: false
        night_led_color:
          name: Night time color setting.
          description: Override color of LEDs between schedule times or when the Night
            Entity is active.
          default: '99'
          selector:
            select:
              mode: dropdown
              options:
              - label: No change
                value: '99'
              - label: White
                value: '0'
              - label: Blue
                value: '1'
              - label: Green
                value: '2'
              - label: Red
                value: '3'
              - label: Magenta
                value: '4'
              - label: Yellow
                value: '5'
              - label: Cyan
                value: '6'
              multiple: false
              custom_value: false
              sort: false
        schedule_stop:
          name: Night time LEDs stop time (Fallback)
          description: LED tracking is restored. Used ONLY if no Nighttime State Entity
            is selected. To disable leave at 00:00:00 default.
          default: 00:00:00
          selector:
            time: {}
    button0:
      name: Big button (Zooz button 5, scene 005) - relay
      input:
        track_relay0:
          name: Big button - LED Track relay
          description: Set to have the LED state track the relay.  Disable to have
            LED track scene or over-ride entity and follow nighttime.
          default: '0'
          selector:
            select:
              mode: dropdown
              options:
              - label: On when load is off
                value: '0'
              - label: On when load is on
                value: '1'
              - label: Disabled
                value: '99'
              multiple: false
              custom_value: false
              sort: false
        scene_5:
          name: Big button (button 5) - Pressed Once
          description: Action to run when button is pressed once.
          default: []
          selector:
            action: {}
        input_entity0:
          name: Entity for big button (button 5)
          description: Choose entity for LED state to track
          default: []
          selector: &tracked_entity
            entity:
              multiple: false
              domain:
              - alarm_control_panel
              - automation
              - binary_sensor
              - climate
              - cover
              - device_tracker
              - fan
              - humidifier
              - input_boolean
              - light
              - lock
              - media_player
              - person
              - schedule
              - script
              - sensor
              - siren
              - switch
              - timer
              - update
              - valve
              reorder: false
        off_state0:
          name: Off behavior for big button (button 5)
          description: Led state when target is off, closed, disarmed or locked
          default: '99'
          selector: &led_state
            select:
              mode: dropdown
              options:
              - label: Always off
                value: '2'
              - label: Always on
                value: '3'
              - label: On during daytime
                value: '99'
              multiple: false
              custom_value: false
              sort: false
        off_color0:
          name: Off color for big button (button 5)
          description: Color for led when target is off (default white)
          default: '0'
          selector: &led_color
            select:
              mode: dropdown
              options:
              - label: White
                value: '0'
              - label: Blue
                value: '1'
              - label: Green
                value: '2'
              - label: Red
                value: '3'
              - label: Magenta
                value: '4'
              - label: Yellow
                value: '5'
              - label: Cyan
                value: '6'
              multiple: false
              custom_value: false
              sort: false
        off_brightness0:
          name: Brightness when big button (button 5) entity is off
          description: LED brightness when entity is off. (1-10 on new firmware; folded
            to Low/Medium/Bright on legacy firmware)
          default: medium
          selector: &led_brightness
            select:
              mode: dropdown
              options:
              - label: 1 (dimmest)
                value: '1'
              - label: '2'
                value: '2'
              - label: '3'
                value: '3'
              - label: '4'
                value: '4'
              - label: '5'
                value: '5'
              - label: '6'
                value: '6'
              - label: '7'
                value: '7'
              - label: '8'
                value: '8'
              - label: '9'
                value: '9'
              - label: 10 (brightest)
                value: '10'
              - label: Low preset (3 / legacy low)
                value: low
              - label: Medium preset (6 / legacy medium)
                value: medium
              - label: Bright preset (10 / legacy bright)
                value: bright
              multiple: false
              custom_value: false
              sort: false
        on_state0:
          name: On behavior for big button (button 5)
          description: Led state when target is on, opened, armed or unlocked
          default: '3'
          selector: *led_state
        on_color0:
          name: On color for big button (button 5)
          description: Color for led when target is on (default blue)
          default: '1'
          selector: *led_color
        on_brightness0:
          name: Brightness when big button (button 5) entity is on
          description: LED brightness when entity is on. (1-10 on new firmware; folded
            to Low/Medium/Bright on legacy firmware)
          default: medium
          selector: *led_brightness
        unavail_state0:
          name: Unavailable State for big button (button 5)
          description: Led state when target is unavailable
          default: '3'
          selector: *led_state
        unavail_color0:
          name: Unavailable Color for big button (button 5)
          description: Color for led when target is unavailable (default red)
          default: '3'
          selector: *led_color
        unavail_brightness0:
          name: Unavailable brightness for big button (button 5)
          description: LED brightness when entity is unavailable. (1-10 on new firmware;
            folded to Low/Medium/Bright on legacy firmware)
          default: medium
          selector: *led_brightness
    button0_multipress:
      name: Big button (Zooz button 5, scene 005) - Hold, release & multi-tap
      collapsed: true
      input:
        scene_5h:
          name: Big button (button 5) - Held
          description: Action to run when button is held.
          default: []
          selector:
            action: {}
        scene_5r:
          name: Big button (button 5) - Released
          description: Action to run when button is released.
          default: []
          selector:
            action: {}
        scene_52:
          name: Big button (button 5) - Pressed 2x
