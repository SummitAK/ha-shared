  enabled: '{{ inputs[3].trigger_entity not in [none, '''', []] }}'
  id: StateTrigger
  alias: '3'
- platform: state
  entity_id: !input input_entity4
  enabled: '{{ inputs[4].trigger_entity not in [none, '''', []] }}'
  id: StateTrigger
  alias: '4'
- platform: event
  event_type: automation_reloaded
  id: AutomationUpdate
  alias: AutomationUpdate
action:
  choose:
  - conditions: '{{ trigger.alias == ''ButtonPress'' }}'
    alias: ButtonPressAction
    sequence:
    - variables:
        input_raw_value: '{{ trigger.event.data.value }}'
        value_to_name:
          0: KeyPressed
          1: KeyHeldDown
          2: KeyReleased
          3: KeyPressed2x
          4: KeyPressed3x
          5: KeyPressed4x
          6: KeyPressed5x
        value: "{% if input_raw_value in value_to_name %}\n  {{ value_to_name[input_raw_value|int]
          }}\n{% else %}\n  {{ trigger.event.data.value }}\n{% endif %}\n"
        property_key_name: '{{ trigger.event.data.property_key_name }}'
        label: '{{ trigger.event.data.label }}'
        command_class_name: '{{ trigger.event.data.command_class_name }}'
    - service: logbook.log
      data:
        name: Z-Wave JS
        message: 'received event: {{ command_class_name }} - {{ value }} - {{ label
          }}{{ '' [panel '' ~ breaker_panel ~ '', breaker '' ~ breaker_circuit ~ '']''
          if breaker_panel or breaker_circuit else '''' }}'
    - choose:
      - conditions: '{{ property_key_name == ''001'' and value == ''KeyPressed'' }}'
        sequence: !input scene_1
      - conditions: '{{ property_key_name == ''001'' and value == ''KeyHeldDown''
