          default: '3'
          selector: *led_state
        unavail_color1:
          name: Unavailable Color for top left button (button 1)
          description: Color for led when target is unavailable (default red)
          default: '3'
          selector: *led_color
        unavail_brightness1:
          name: Unavailable brightness for top left button (button 1)
          description: LED brightness when entity is unavailable. (1-10 on new firmware;
            folded to Low/Medium/Bright on legacy firmware)
          default: medium
