      - conditions: '{{ property_key_name == ''005'' and value == ''KeyPressed4x''
          }}'
        sequence: !input scene_54
      - conditions: '{{ property_key_name == ''005'' and value == ''KeyPressed5x''
          }}'
        sequence: !input scene_55
      - conditions: '{{ property_key_name == ''006'' and value == ''KeyPressed'' }}'
        sequence: !input scene_6
      - conditions: '{{ property_key_name == ''006'' and value == ''KeyHeldDown''
          }}'
        sequence: !input scene_6h
      - conditions: '{{ property_key_name == ''006'' and value == ''KeyReleased''
          }}'
        sequence: !input scene_6r
      - conditions: '{{ property_key_name == ''006'' and value == ''KeyPressed2x''
          }}'
        sequence: !input scene_62
      - conditions: '{{ property_key_name == ''006'' and value == ''KeyPressed3x''
          }}'
        sequence: !input scene_63
      - conditions: '{{ property_key_name == ''006'' and value == ''KeyPressed4x''
          }}'
        sequence: !input scene_64
      - conditions: '{{ property_key_name == ''006'' and value == ''KeyPressed5x''
          }}'
        sequence: !input scene_65
  - conditions: "{{\n  trigger.id == 'StateTrigger' and\n  inputs[trigger.alias |
      int].track_relay not in ['0', '1'] and\n  (trigger.from_state is none or\n   trigger.to_state.state
      != trigger.from_state.state)\n}}\n"
    alias: SingleButtonStateUpdate
    sequence:
    - delay:
        milliseconds: 250
    - &id001
      alias: Wait until the scene controller is reachable (v1.3.0)
      wait_template: '{{ device_entities(controller_id) | map(''states'') | reject(''in'',
        [''unavailable'', ''unknown'']) | list | count > 0 }}'
      timeout: 00:02:00
      continue_on_timeout: false
    - variables:
        current: '{{ inputs[trigger.alias | int] }}'
        target_state: '{{ states(inputs[trigger.alias | int].trigger_entity) }}'
        prev_state: '{{ trigger.from_state.state if trigger.from_state is not none
          else ''unknown'' }}'
    - variables: &id002
        map_b_off: '{{ brightness_map.get(current.off_brightness | string, brightness_map[''medium''])
          }}'
        map_b_on: '{{ brightness_map.get(current.on_brightness | string, brightness_map[''medium''])
          }}'
        map_b_unavail: '{{ brightness_map.get(current.unavail_brightness | string,
          brightness_map[''medium'']) }}'
        condition: "{% if target_state in off_states %}\n  {{ dict(state=current.off_state,
          color=current.off_color, brightness=map_b_off) }}\n{% elif target_state
          in on_states %}\n  {{ dict(state=current.on_state, color=current.on_color,
          brightness=map_b_on) }}\n{% elif target_state == \"unavailable\" %}\n  {{
          dict(state=current.unavail_state, color=current.unavail_color, brightness=map_b_unavail)
          }}\n{% else %}\n  {{ dict(state=None, color=None, brightness=None) }}\n{%
          endif %}\n"
        parameter:
          toggle: '{{ current.button_id | int + toggle_offset | int }}'
          color: '{{ current.button_id | int + color_offset | int }}'
          brightness: '{{ current.button_id | int + brightness_offset | int }}'
    - variables:
        prev_condition: "{% if prev_state in off_states %}\n  {{ dict(state=current.off_state,
          color=current.off_color, brightness=map_b_off) }}\n{% elif prev_state in
          on_states %}\n  {{ dict(state=current.on_state, color=current.on_color,
          brightness=map_b_on) }}\n{% elif prev_state == \"unavailable\" %}\n  {{
          dict(state=current.unavail_state, color=current.unavail_color, brightness=map_b_unavail)
          }}\n{% else %}\n  {{ dict(state=None, color=None, brightness=None) }}\n{%
          endif %}\n"
        night_active: '{{ (schedule_set and in_nighttime) | bool }}'
    - variables:
        want: "{% set c = condition %} {{ dict(\n     toggle=((('2' if night_active
          else '3') if (c.state | string) == '99' else c.state) | string),\n     color=((night_led_color
          if ((night_led_color | string) != '99' and night_active) else c.color) |
          string),\n     brightness=((night_led_brightness if (night_brightness_override
          and night_active) else c.brightness) | string)) }}\n"
        had: "{% set c = prev_condition %} {% if c.state is none %}\n  {{ dict(toggle='none',
          color='none', brightness='none') }}\n{% else %}\n  {{ dict(\n       toggle=((('2'
          if night_active else '3') if (c.state | string) == '99' else c.state) |
          string),\n       color=((night_led_color if ((night_led_color | string)
          != '99' and night_active) else c.color) | string),\n       brightness=((night_led_brightness
          if (night_brightness_override and night_active) else c.brightness) | string))
          }}\n{% endif %}\n"
    - if:
      - condition: template
        value_template: '{{ condition.state is not none }}'
      then:
      - if:
        - condition: template
          value_template: '{{ had.toggle != want.toggle }}'
        then:
        - service: zwave_js.set_config_parameter
          continue_on_error: true
          data:
            parameter: '{{ parameter.toggle }}'
            value: '{{ want.toggle }}'
          target:
            device_id: '{{ controller_id }}'
        - delay:
            milliseconds: 300
      - if:
        - condition: template
          value_template: '{{ had.color != want.color }}'
        then:
        - service: zwave_js.set_config_parameter
          continue_on_error: true
          data:
            parameter: '{{ parameter.color }}'
            value: '{{ want.color }}'
          target:
            device_id: '{{ controller_id }}'
        - delay:
            milliseconds: 300
      - if:
        - condition: template
          value_template: '{{ had.brightness != want.brightness }}'
        then:
        - service: zwave_js.set_config_parameter
          continue_on_error: true
          data:
            parameter: '{{ parameter.brightness }}'
            value: '{{ want.brightness }}'
          target:
            device_id: '{{ controller_id }}'
  - conditions: "{{\n  (trigger.id in ['NightTime', 'DayTime'] and schedule_set) or\n
      \ (trigger.id == 'HassStart') or\n  (trigger.id == 'EntityToggle' and schedule_set
      and\n   (trigger.from_state is none or\n    trigger.to_state.state != trigger.from_state.state))\n}}\n"
    alias: UniversalRefreshAction
    sequence:
    - if:
      - condition: template
        value_template: '{{ trigger.id == ''HassStart'' }}'
      then:
      - delay: 00:01:00
    - *id001
    - if:
      - condition: template
        value_template: '{{ turn_off_untracked and untracked_buttons | length > 0
          }}'
      then: &id003
      - repeat:
          for_each: '{{ untracked_buttons }}'
          sequence:
          - service: zwave_js.set_config_parameter
            continue_on_error: true
            data:
              parameter: '{{ repeat.item.button_id | int + toggle_offset | int }}'
              value: '2'
            target:
              device_id: '{{ controller_id }}'
    - repeat: &id004
        for_each: '{{ valid_buttons }}'
        sequence:
        - variables:
            current: '{{ repeat.item }}'
            target_state: '{{ states(repeat.item.trigger_entity) }}'
        - variables: *id002
        - if:
          - condition: template
            value_template: '{{ condition.state is not none }}'
          then:
            sequence:
            - service: zwave_js.set_config_parameter
              continue_on_error: true
              data:
                parameter: '{{ parameter.toggle }}'
                value: "{% if condition.state == '99' %}\n  {{ '2' if schedule_set
                  and in_nighttime else '3' }}\n{% else %}\n  {{ condition.state }}\n{%
                  endif %}\n"
              target:
                device_id: '{{ controller_id }}'
            - delay:
                milliseconds: 300
            - service: zwave_js.set_config_parameter
              continue_on_error: true
              data:
                parameter: '{{ parameter.color }}'
                value: "{% if night_led_color != '99' and in_nighttime and schedule_set
                  %}\n  {{ night_led_color }}\n{% else %}\n  {{ condition.color }}\n{%
                  endif %}\n"
              target:
                device_id: '{{ controller_id }}'
            - delay:
                milliseconds: 300
            - service: zwave_js.set_config_parameter
              continue_on_error: true
              data:
                parameter: '{{ parameter.brightness }}'
                value: '{{ night_led_brightness if (night_brightness_override and
                  in_nighttime and schedule_set) else condition.brightness }}'
              target:
                device_id: '{{ controller_id }}'
        - delay:
            milliseconds: 300
  - conditions: "{{\n  trigger.id == 'AutomationUpdate' and this is defined and\n
      \ (as_timestamp(now()) - as_timestamp(this.last_changed, 0)) < 15\n}}\n"
    alias: AutomationUpdateAction
    sequence:
    - *id001
    - service: zwave_js.set_config_parameter
      continue_on_error: true
      data:
        parameter: '1'
        value: '{{ ''2'' if inputs[0].track_relay == ''99'' else inputs[0].track_relay
          }}'
      target:
        device_id: '{{ controller_id }}'
    - if:
      - condition: template
        value_template: '{{ inputs[0].track_relay in [''0'', ''1''] }}'
      then:
      - variables:
          relay_lit_color: '{{ inputs[0].off_color if inputs[0].track_relay == ''0''
            else inputs[0].on_color }}'
          relay_lit_brightness: '{% set b = inputs[0].off_brightness if inputs[0].track_relay
            == ''0'' else inputs[0].on_brightness %} {{ brightness_map.get(b | string,
            brightness_map[''medium'']) }}

            '
      - delay:
          milliseconds: 300
      - service: zwave_js.set_config_parameter
        continue_on_error: true
        data:
          parameter: '6'
          value: '{{ relay_lit_color }}'
        target:
          device_id: '{{ controller_id }}'
      - delay:
          milliseconds: 300
      - service: zwave_js.set_config_parameter
        continue_on_error: true
        data:
          parameter: '11'
          value: '{{ relay_lit_brightness }}'
        target:
          device_id: '{{ controller_id }}'
    - service: zwave_js.set_config_parameter
      continue_on_error: true
      data:
        parameter: '19'
        value: '{{ input_p19 }}'
      target:
        device_id: '{{ controller_id }}'
    - service: zwave_js.set_config_parameter
      continue_on_error: true
      data:
        parameter: '20'
        value: '{{ input_p20 }}'
      target:
        device_id: '{{ controller_id }}'
    - if:
      - condition: template
        value_template: '{{ turn_off_untracked and untracked_buttons | length > 0
          }}'
      then: *id003
    - repeat: *id004
