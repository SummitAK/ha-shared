          description: Action to run when button is pressed four times.
          default: []
          selector:
            action: {}
        scene_35:
          name: Bottom left button (button 3) - Pressed 5x
          description: Action to run when button is pressed five times.
          default: []
          selector:
            action: {}
    button5:
      name: Bottom right button (Zooz button 4, scene 004)
      input:
        scene_4:
          name: Bottom right button (button 4) - Pressed Once
          description: Action to run when button is pressed once.
          default: []
          selector:
            action: {}
        input_entity4:
          name: Entity for bottom right button (button 4)
          description: Choose entity for LED state to track
          default: []
          selector: *tracked_entity
        off_state4:
          name: Off behavior for bottom right button (button 4)
          description: Led state when target is off, closed, disarmed or locked
          default: '99'
          selector: *led_state
        off_color4:
          name: Off color for bottom right button (button 4)
          description: Color for led when target is off (default white)
          default: '0'
          selector: *led_color
        off_brightness4:
          name: Brightness when bottom right button (button 4) entity is off
          description: LED brightness when entity is off. (1-10 on new firmware; folded
            to Low/Medium/Bright on legacy firmware)
          default: medium
          selector: *led_brightness
        on_state4:
          name: On behavior for bottom right button (button 4)
          description: Led state when target is on, opened, armed or unlocked
          default: '3'
          selector: *led_state
        on_color4:
          name: On color for bottom right button (button 4)
          description: Color for led when target is on (default green)
          default: '2'
          selector: *led_color
        on_brightness4:
          name: Brightness when bottom right button (button 4) entity is on
          description: LED brightness when entity is on. (1-10 on new firmware; folded
            to Low/Medium/Bright on legacy firmware)
          default: medium
          selector: *led_brightness
        unavail_state4:
          name: Unavailable State for bottom right button (button 4)
          description: Led state when target is unavailable
          default: '3'
          selector: *led_state
        unavail_color4:
          name: Unavailable Color for bottom right button (button 4)
          description: Color for led when target is unavailable (default red)
          default: '3'
          selector: *led_color
        unavail_brightness4:
          name: Unavailable brightness for bottom right button (button 4)
          description: LED brightness when entity is unavailable. (1-10 on new firmware;
            folded to Low/Medium/Bright on legacy firmware)
          default: medium
          selector: *led_brightness
    button5_multipress:
      name: Bottom right button (Zooz button 4, scene 004) - Hold, release & multi-tap
      collapsed: true
      input:
        scene_4h:
          name: Bottom right button (button 4) - Held
          description: Action to run when button is held.
          default: []
          selector:
            action: {}
        scene_4r:
          name: Bottom right button (button 4) - Released
          description: Action to run when button is released.
          default: []
          selector:
            action: {}
        scene_42:
          name: Bottom right button (button 4) - Pressed 2x
          description: Action to run when button is pressed twice.
          default: []
          selector:
            action: {}
        scene_43:
          name: Bottom right button (button 4) - Pressed 3x
          description: Action to run when button is pressed three times.
          default: []
          selector:
            action: {}
        scene_44:
          name: Bottom right button (button 4) - Pressed 4x
          description: Action to run when button is pressed four times.
          default: []
          selector:
            action: {}
        scene_45:
          name: Bottom right button (button 4) - Pressed 5x
          description: Action to run when button is pressed five times.
          default: []
          selector:
            action: {}
    3way_switch:
      name: 3 Way switch scene control - Requires 3 way to be set to momentary - Requires
        800 series or firmware 10.40+ on 700 series
      collapsed: true
      input:
        scene_6:
          name: Scene 6 - Pressed Once
          description: Action to run when 3 way switch is pressed once.
          default: []
          selector:
            action: {}
        scene_6h:
          name: Scene 6 - Held
          description: Action to run when 3 way switch button is held.
          default: []
          selector:
            action: {}
        scene_6r:
          name: Scene 6 - Released
          description: Action to run when 3 way switch is released.
          default: []
          selector:
            action: {}
        scene_62:
          name: Scene 6 - Pressed 2x
          description: Action to run when 3 way switch is pressed twice.
          default: []
          selector:
            action: {}
        scene_63:
          name: Scene 6 - Pressed 3x
          description: Action to run when 3 way switch is pressed three times.
          default: []
          selector:
            action: {}
        scene_64:
          name: Scene 6 - Pressed 4x
          description: Action to run when 3 way switch is pressed four times.
          default: []
          selector:
            action: {}
        scene_65:
          name: Scene 6 - Pressed 5x
          description: Action to run when 3 way switch is pressed five times.
          default: []
