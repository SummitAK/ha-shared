          name: Night starts at (when no night entity)
          description: Leave start and stop both at 00:00:00 to disable night mode.
          default: 00:00:00
          selector:
            time: {}
        schedule_stop:
          name: Night ends at (when no night entity)
          default: 00:00:00
          selector:
            time: {}
