      smart_mode: 12
      scene_control: 10
      opposite_led: 20
    zen77:
      orientation: 1
      led_mode: 2
      led_color: 23
      led_brightness: 24
      auto_off: 3
      auto_on: 5
      power_failure: 8
      smart_mode: 15
      scene_control: 13
      ramp_on_manual: 9
      ramp_off_manual: 27
      min_brightness: 10
      max_brightness: 11
      double_tap: 12
      single_tap: 25
      custom_brightness: 18
      local_dimming_speed: 16
      night_light: 22
      local_programming: 26
      opposite_led: 37
    zen32:
      led_mode: 1
      led_color: 6
      led_brightness: 11
      auto_off: 16
      auto_on: 17
      power_failure: 18
      smart_mode: 19
      scene_control: 24
    zen35:
      led_mode: 1
      led_color: 6
      led_brightness: 11
      auto_off: 16
      auto_on: 17
      power_failure: 18
      smart_mode: 19
      scene_control: 36
      ramp_on_manual: 21
      ramp_off_manual: 22
      min_brightness: 27
      max_brightness: 28
      double_tap: 29
      single_tap: 30
