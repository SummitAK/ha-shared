variables:
  controller_id: !input zooz_switch
  mirror_entity: !input mirror_entity
  self_entity: '{{ (device_entities(controller_id) | select(''match'', ''light\.'')
    | list + device_entities(controller_id) | select(''match'', ''switch\.'') | list)
    | first | default('''') }}'
  breaker_panel: !input breaker_panel
  breaker_circuit: !input breaker_circuit
  device_model: '{{ device_attr(controller_id, ''model'') or '''' }}'
  model_key: '{% if ''ZEN71'' in device_model %}zen71

    {%- elif ''ZEN72'' in device_model %}zen72

    {%- elif ''ZEN76'' in device_model %}zen76

    {%- elif ''ZEN77'' in device_model %}zen77

    {%- elif ''ZEN32'' in device_model %}zen32

    {%- elif ''ZEN35'' in device_model %}zen35

    {%- else %}unknown{% endif %}'
  device_fw_code: '{% set sw = (device_attr(controller_id, ''sw_version'') or ''0.0'')
    | string %} {% set p = sw.split(''.'') %} {{ (p[0] | int(0)) * 100 + ((p[1] if
    p | length > 1 else ''0'') | int(0)) }}'
  led_scale_override: !input led_scale_override
  led_scale_new: "{%- if led_scale_override == 'auto' -%}\n  {%- if model_key == 'zen32'
    -%}{{ 330 <= device_fw_code | int(0) < 1000 }}\n  {%- elif model_key == 'zen35'
    -%}{{ device_fw_code | int(0) >= 140 }}\n  {%- else -%}{{ false }}\n  {%- endif
    -%}\n{%- else -%}{{ led_scale_override == 'new' }}\n{%- endif -%}"
  is_extended_color: '{%- if model_key == ''zen35'' -%}{{ true }}

    {%- elif model_key == ''zen32'' -%}{{ device_fw_code | int(0) >= 1040 or 210 <=
    device_fw_code | int(0) < 1000 }}

    {%- else -%}{{ false }}

    {%- endif -%}'
  param_map:
