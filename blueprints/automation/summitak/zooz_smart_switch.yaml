blueprint:
  name: Zooz Smart Switch Suite (ZEN71/72/76/77/32/35) v0.7.0-beta.2 BETA
  description: 'One blueprint to configure and automate Zooz Z-Wave switches: ZEN71/ZEN76
    (on/off), ZEN72/ZEN77 (dimmers), ZEN32/ZEN35 (scene controllers).


    **What it does (v0.1.0):**

    - Graphical editing of the most-used Z-Wave configuration parameters. Settings
    default to "No change" / -1 (except the ZEN77 house defaults listed under v0.4.0),
    so only the settings you pick are written to the switch. Parameter numbers are
    translated per model automatically (e.g. LED color is parameter 14 on ZEN71/76,
    23 on ZEN72/77, 6 on ZEN32/35).

    - Extended LED colors (White/Blue/Green/Red/Magenta/Yellow/Cyan) with the 1-10
    brightness scale carried over from the local ZEN32 blueprint fork. On models/firmware
    that only support 4 colors (all ZEN7x) the extended colors fold to the nearest
    supported color; on 0-2 brightness firmware the 1-10 scale folds to Low/Medium/Bright.

    - Paddle and button scene actions: tap 1x-5x, hold, and release actions for the
    upper (001) and lower (002) paddles, and on ZEN32/ZEN35 for every button (001-004
    small buttons, 005 big button / ZEN35 dimmer paddle, 006 ZEN32 3-way input).

    - ZEN32/ZEN35 LED tracking (v0.7.0): each button LED can follow any entity, with
    its own color and brightness for on, off and unavailable, plus a night mode.

    - **Stepped dimming**: an optional mode that replaces hold-to-ramp with discrete
    steps - hold the upper paddle to step brightness UP in configurable increments
    (default 10% from 20% to 100%), hold the lower paddle to step DOWN (default 100%
    to 20%), with an editable pause per level in milliseconds. Works best when the
    switch does not locally dim its own load (smart bulb mode, or a separate target
    light).


    Settings are pushed to the switch 60 s after Home Assistant starts and every time
    you save this automation, so the blueprint form works as a graphical config editor.
    **Scene Control must be set to Enable** for paddle actions and stepped dimming
    to work.


    Parameter maps verified against the Z-Wave JS device database (zwave-js config
    files for ZEN71/72/76/77/32/35, Oct 2026). **Version:** 0.7.0-beta.2 (BETA - test
    install only; production automations stay on 0.6.x until this is promoted)


    **v0.7.0-beta.2:** Brings in the v0.6.1 production change (opposite-state LED
    color on all ZEN7x).


    **v0.7.0-beta.1:** Merges the ZEN32/ZEN35 Scene Controller blueprint (v1.3.1)
    into the Suite so each scene controller is configured in one automation. New
    for ZEN32/ZEN35: actions for buttons 3, 4, 5 (big button / ZEN35 dimmer paddle)
    and 6 (ZEN32 3-way input); per-button LED tracking (entity, on/off/unavailable
    color and brightness) with night mode and "turn off untracked LEDs"; the "Disabled
    load behavior" setting (parameter 20). Input names for LED tracking and night mode
    match the scene controller blueprint, so its automations migrate by copying
    those values. When the big button''s LED tracks an entity, the LED indicator mode,
    color and brightness settings are not written to that LED (tracking owns it).
    Changes for all models: hold/release actions are only suppressed on the keys
    that stepped dimming actually uses (previously keys 001/002 whenever stepped
    dimming was on); configuration writes now wait (up to 2 minutes) until the switch
    is actually reachable - the Z-Wave JS entry is loaded and the switch''s own light/switch
    entity has a real state - instead of trusting restored entity states, which let
    writes fail with "No zwave_js nodes found" after a Z-Wave JS restart.


    **v0.6.1:** Opposite-state LED color now works on every ZEN7x (parameter 21
    on ZEN71, 36 on ZEN72, 20 on ZEN76, 37 on ZEN77 - ZEN71/ZEN72 firmware 4.20 and
    ZEN76 4.10 verified), so a no-load remote can show exactly the same LED colors
    as the switch it controls. The new default "House default" keeps every existing
    automation unchanged: White on ZEN77, no change on other models. Pick a color
    (or Off) explicitly to set it on ZEN71/ZEN72/ZEN76.


    **v0.6.0:** Direct links (Z-Wave association) - optional. List the lights this
    switch should control directly, switch to switch, so its paddles keep working
    if Home Assistant is down. On save and 60 s after Home Assistant starts, the
    switch''s association group is written: group 3 (dimming) on ZEN72/ZEN77,
    group 2 (on/off) on ZEN71/ZEN76; ZEN32/ZEN35 need the group set explicitly.
    For a two-way (virtual 3-way) pair, each switch''s automation lists the other.
    Links can only be added or removed (Home Assistant cannot read the groups back),
    so to drop a link move it to "Remove direct links to". Group 1 (Lifeline) is
    never touched, parameter 7 is never changed, and Long Range nodes (node ID 256
    and up) are skipped because Long Range does not support switch-to-switch links.
    Every link change is written to the Logbook. Use HA scene actions only for
    what the direct link cannot do (2x-5x taps, other lights); a warning is logged
    if a 1x or hold action targets a directly linked light, because the light would
    get two commands. In the Z-Wave JS panel, use Groups > Refresh (force query)
    to see the result; the panel''s cached view does not update on its own.


    **v0.5.0:** Follow light (LED/state mirror) - optional. Pick the light this switch
    controls remotely (typically on a no-load ZEN7x wired as a remote for a load switch
    elsewhere). Whenever that light turns on or off from ANY source - its own load
    paddle, another automation such as Lighting Guard, a dashboard or voice - this
    switch is set to the same on/off state, so its LED shows the same color as the
    load switch. Also re-syncs 60 s after Home Assistant starts and whenever this
    automation is saved. Leave empty to disable (default). No loop risk: Z-Wave on/off
    commands do not generate paddle (Central Scene) events, and this blueprint only
    acts on paddle events.


    **v0.4.2:** State after power failure now defaults to "Always off" (all models
    except ZEN32, which uses its own map). Automations for ZEN32/ZEN35/ZEN71/ZEN72/ZEN76
    that should keep their current setting must set it to "No change" explicitly.


    **v0.4.1:** Fixed the LED scale / extended-color detection helpers. They rendered
    the lowercase text "false" for ZEN7x models, which Home Assistant treats as a
    (truthy) string, so ZEN7x switches were sent 1-10 brightness values (for example
    Low = 3) that the hardware rejects (valid range 0-2) and extended-color values
    were not folded. They now render real booleans.


    **v0.4.0:** House defaults for the ZEN77 and two new ZEN77 settings. New defaults:
    LED indicator mode = On when load is off, LED color = Green, LED brightness =
    Low (30%), Local Programming = Disabled, Opposite-state LED = White. New inputs:
    Local programming (ZEN77 parameter 26) and Opposite-state LED color (ZEN77 parameter
    37; the ZEN77 has no separate brightness setting for it). The new inputs only
    apply to the ZEN77; they are ignored on other models. The three LED defaults DO
    apply to every model, so automations for ZEN32/ZEN35/ZEN71/ZEN72/ZEN76 that should
    keep their current LED settings must set LED mode, color and brightness to "No
    change" explicitly.


    **v0.3.0:** Electrical identification fields - Circuit Breaker Panel and Breaker
    Circuit are stored with each switch''s automation (shown in this form with the
    other switch settings, included in debug logging and traces) so the breakers to
    lock out for electrical work can be reconciled per switch instead of being crammed
    into device names.


    **v0.2.1:** One-button bidirectional stepping - set the step-UP and step-DOWN
    keys to the SAME key and the light''s state picks the direction: holding while
    the light is ON steps it down, holding while it is OFF steps it up from the lowest
    level. Made for the ZEN32/35 big button (key 005).


    **v0.2.0:** The scene keys that drive stepped dimming are now selectable, so ZEN32/ZEN35
    buttons can step any light: ZEN7x 001 = upper / 002 = lower paddle; ZEN32 001-004
    = small buttons, 005 = big button; ZEN35 001-004 = small buttons, 005 = dimmer
    paddle. ZEN32 small buttons have no local load, so Hold-step works on them without
    smart bulb mode.


    **v0.1.1:** Stepped dimming now has two styles - Hold-step (discrete steps while
    held; for no-load / smart bulb units) and Release-snap (the hardware hold-dim
    ramps normally, brightness snaps to the nearest step on release; for load-connected
    dimmers, where local dimming overrides Z-Wave steps while the paddle is held).
    All step commands now use continue_on_error so one failed Z-Wave write cannot
    hang a run.

    '
  domain: automation
  source_url: https://github.com/SummitAK/ha-shared/blob/beta/blueprints/automation/summitak/zooz_smart_switch.yaml
  author: Brendan McKee
  homeassistant:
    min_version: 2024.10.0
  input:
    switch_section:
      name: Switch
      icon: mdi:light-switch
      input:
        zooz_switch:
          name: Zooz switch
          description: A Zooz ZEN71, ZEN72, ZEN76, ZEN77, ZEN32, or ZEN35 (including
            800LR variants).
          selector:
            device:
              filter:
              - integration: zwave_js
                manufacturer: Zooz
                model: ZEN71
              - integration: zwave_js
                manufacturer: Zooz
                model: ZEN71 800LR
              - integration: zwave_js
                manufacturer: Zooz
                model: ZEN72
              - integration: zwave_js
                manufacturer: Zooz
                model: ZEN72 800LR
              - integration: zwave_js
                manufacturer: Zooz
                model: ZEN76
              - integration: zwave_js
                manufacturer: Zooz
                model: ZEN76 800LR
              - integration: zwave_js
                manufacturer: Zooz
                model: ZEN77
              - integration: zwave_js
                manufacturer: Zooz
                model: ZEN77 800LR
              - integration: zwave_js
                manufacturer: Zooz
                model: ZEN32
              - integration: zwave_js
                manufacturer: Zooz
                model: ZEN32 800LR
              - integration: zwave_js
                manufacturer: Zooz
                model: ZEN35
              multiple: false
        led_scale_override:
          name: LED brightness scale
          description: Auto-detect picks the 1-10 scale on ZEN32 firmware 3.30-9.x
            and ZEN35 1.40+, and the Bright/Medium/Low (0-2) scale everywhere else
            (all ZEN7x use 0-2). Override only if auto-detect gets it wrong.
          default: auto
          selector:
            select:
              mode: dropdown
              options:
              - label: Auto-detect from model and firmware (Recommended)
                value: auto
              - label: 1-10 scale
                value: new
              - label: 0-2 scale (Bright/Medium/Low)
                value: legacy
              multiple: false
              custom_value: false
              sort: false
        debug_logging:
          name: Debug logging
          description: Write received button events to the Logbook.
          default: false
          selector:
            boolean: {}
        breaker_panel:
          name: Circuit breaker panel
          description: Electrical documentation - the panel that feeds this switch
            (e.g. "Main" or "Garage sub-panel"). Stored here with the switch's other
            settings for safety lockout reconciliation; no effect on behavior.
          default: ''
          selector:
            text:
              multiline: false
              multiple: false
        breaker_circuit:
          name: Breaker circuit
          description: Electrical documentation - the breaker number in that panel
            (e.g. "7" or "21"). No effect on behavior.
          default: ''
          selector:
            text:
              multiline: false
              multiple: false
    config_common:
      name: Switch configuration - all models
      icon: mdi:cog
      collapsed: true
      input:
        cfg_orientation:
          name: Paddle orientation (ZEN7x only)
          description: Parameter 1. Not available on ZEN32/ZEN35.
          default: nc
          selector:
            select:
              mode: dropdown
              options:
              - label: No change
                value: nc
              - label: Normal (top = on)
                value: '0'
              - label: Inverted (top = off)
                value: '1'
              - label: Momentary (any press toggles)
                value: '2'
              multiple: false
              custom_value: false
              sort: false
        cfg_led_mode:
          name: LED indicator mode
          description: When the LED is lit. On ZEN32/ZEN35 this applies to the big
            relay/dimmer button, and is not written while that LED tracks an entity
            (LED tracking - big button). Default (v0.4.0) is "On when load is off" -
            set "No change" explicitly on non-ZEN77 switches that should keep their
            current setting.
          default: '0'
          selector:
            select:
              mode: dropdown
              options:
              - label: No change
                value: nc
              - label: On when load is off
                value: '0'
              - label: On when load is on
                value: '1'
              - label: Always off
                value: '2'
              - label: Always on
                value: '3'
              multiple: false
              custom_value: false
              sort: false
        cfg_led_color:
          name: LED indicator color
          description: Extended colors (Magenta/Yellow/Cyan) are supported on ZEN32
            (firmware 2.10+) and ZEN35. On ZEN7x they fold to the nearest supported
            color (Magenta to Red, Yellow to White, Cyan to Blue). On ZEN32/ZEN35
            this sets the big-button LED unless that LED tracks an entity. Default
            (v0.4.0) is Green - set "No change" explicitly on non-ZEN77 switches that
            should keep their current setting.
          default: '2'
          selector:
            select:
              mode: dropdown
              options:
              - label: No change
                value: nc
              - label: White
                value: '0'
              - label: Blue
                value: '1'
              - label: Green
                value: '2'
              - label: Red
                value: '3'
              - label: Magenta
                value: '4'
              - label: Yellow
                value: '5'
              - label: Cyan
                value: '6'
              multiple: false
              custom_value: false
              sort: false
        cfg_led_brightness:
          name: LED indicator brightness
          description: 1-10 scale with presets. Folds to Bright/Medium/Low on 0-2
            scale hardware (all ZEN7x; ZEN32/ZEN35 on legacy firmware). Default (v0.4.0)
            is the Low preset (30% on ZEN7x) - set "No change" explicitly on non-ZEN77
            switches that should keep their current setting.
          default: low
          selector:
            select:
              mode: dropdown
              options:
              - label: No change
                value: nc
              - label: 1 (dimmest / 10%)
                value: '1'
              - label: '2'
                value: '2'
              - label: '3'
                value: '3'
              - label: '4'
                value: '4'
              - label: '5'
                value: '5'
              - label: '6'
                value: '6'
              - label: '7'
                value: '7'
              - label: '8'
                value: '8'
              - label: '9'
                value: '9'
              - label: 10 (brightest / 100%)
                value: '10'
              - label: Low preset (3 / legacy Low)
                value: low
              - label: Medium preset (6 / legacy Medium)
                value: medium
              - label: Bright preset (10 / legacy Bright)
                value: bright
              multiple: false
              custom_value: false
              sort: false
        cfg_opposite_led:
          name: Opposite-state LED color (ZEN7x)
          description: The LED color shown in the opposite switch state when LED indicator
            mode is "On when load is off" or "On when load is on" (for example, with
            "On when load is off" this is the color shown while the load is ON). Off
            turns that LED off. There is no separate brightness for this LED; it follows
            the LED indicator brightness. Parameter 21 on ZEN71, 36 on ZEN72, 20 on
            ZEN76, 37 on ZEN77; ignored on ZEN32/ZEN35. House default (v0.6.1) is White
            on ZEN77 and no change on other models.
          default: house
          selector:
            select:
              mode: dropdown
              options:
              - label: House default (White on ZEN77, no change on others)
                value: house
              - label: No change
                value: nc
              - label: 'Off'
                value: 'off'
              - label: White
                value: white
              - label: Blue
                value: blue
              - label: Green
                value: green
              - label: Red
                value: red
              multiple: false
              custom_value: false
              sort: false
        cfg_auto_off:
          name: Auto turn-off timer (minutes)
          description: -1 = no change. 0 = timer disabled. 1-65535 = turn the load
            off after this many minutes.
          default: -1
          selector:
            number:
              min: -1.0
              max: 65535.0
              step: 1.0
              mode: box
              unit_of_measurement: min
        cfg_auto_on:
          name: Auto turn-on timer (minutes)
          description: -1 = no change. 0 = timer disabled. 1-65535 minutes.
          default: -1
          selector:
            number:
              min: -1.0
              max: 65535.0
              step: 1.0
              mode: box
              unit_of_measurement: min
        cfg_power_failure:
          name: State after power failure
          description: Translated per model (ZEN32 uses a different value map). Default
            (v0.4.2) is Always off - set "No change" on non-ZEN77 models to keep their
            current setting.
          default: 'off'
          selector:
            select:
              mode: dropdown
              options:
              - label: No change
                value: nc
              - label: Always off
                value: 'off'
              - label: Always on
                value: 'on'
              - label: Previous state
                value: previous
              multiple: false
              custom_value: false
              sort: false
        cfg_smart_mode:
          name: Smart switch mode (load control)
          description: Disable local control for smart bulb mode, or when the paddle
            should only run scenes.
          default: nc
          selector:
            select:
              mode: dropdown
              options:
              - label: No change
                value: nc
              - label: Local control disabled (smart bulb mode)
                value: '0'
              - label: Local and Z-Wave control enabled
                value: '1'
              - label: Local and Z-Wave control disabled
                value: '2'
              multiple: false
              custom_value: false
              sort: false
        cfg_disabled_load_behavior:
          name: Disabled load behavior (ZEN32/ZEN35 only)
          description: Parameter 20. What the big button does while its local control
            is disabled (smart bulb mode). Report and toggle LED keeps status reports
            and the LED changing; Do nothing stops both. On a scene-only ZEN32 big
            button, "Do nothing" has been seen to mute its scene events too, so use
            Report and toggle LED there. Ignored on other models.
          default: nc
          selector:
            select:
              mode: dropdown
              options:
              - label: No change
                value: nc
              - label: Report and toggle LED
                value: '0'
              - label: Do nothing
                value: '1'
              multiple: false
              custom_value: false
              sort: false
        cfg_scene_control:
          name: Scene control
          description: Must be ENABLED for paddle actions and stepped dimming in this
            blueprint to receive button events. Translated per model (the ZEN32 relay-button
            parameter is inverted).
          default: nc
          selector:
            select:
              mode: dropdown
              options:
              - label: No change
                value: nc
              - label: Enable
                value: enable
              - label: Disable
                value: disable
              multiple: false
              custom_value: false
              sort: false
        cfg_local_programming:
          name: Local programming (ZEN77 only)
          description: Parameter 26. Controls whether the switch can be included/excluded
            through physical paddle sequences. Disabling it frees those sequences
            for scene control; a factory reset remains available. Default (v0.4.0)
            is Disabled. Ignored on other models.
          default: disable
          selector:
            select:
              mode: dropdown
              options:
              - label: No change
                value: nc
              - label: Enable local programming
                value: enable
              - label: Disable local programming
                value: disable
              multiple: false
              custom_value: false
              sort: false
    config_dimmer:
      name: Switch configuration - dimmers (ZEN72/ZEN77/ZEN35)
      icon: mdi:brightness-6
      collapsed: true
      input:
        cfg_ramp_on_manual:
          name: Ramp rate ON - paddle (seconds)
          description: -1 = no change. 0 = instant on. 1-99 seconds.
          default: -1
          selector:
            number:
              min: -1.0
              max: 99.0
              step: 1.0
              mode: box
              unit_of_measurement: s
        cfg_ramp_off_manual:
          name: Ramp rate OFF - paddle (seconds)
          description: -1 = no change. 0 = instant off. 1-99 seconds.
          default: -1
          selector:
            number:
              min: -1.0
              max: 99.0
              step: 1.0
              mode: box
              unit_of_measurement: s
        cfg_min_brightness:
          name: Minimum brightness (%)
          description: -1 = no change. 1-99.
          default: -1
          selector:
            number:
              min: -1.0
              max: 99.0
              step: 1.0
              mode: box
              unit_of_measurement: '%'
        cfg_max_brightness:
          name: Maximum brightness (%)
          description: -1 = no change. 1-99.
          default: -1
          selector:
            number:
              min: -1.0
              max: 99.0
              step: 1.0
              mode: box
              unit_of_measurement: '%'
        cfg_double_tap:
          name: Double-tap upper paddle behavior
          default: nc
          selector:
            select:
              mode: dropdown
              options:
              - label: No change
                value: nc
              - label: Full brightness
                value: '0'
              - label: Custom brightness (see Custom brightness level)
                value: '1'
              - label: Configured maximum brightness
                value: '2'
              - label: Double tap disabled
                value: '3'
              multiple: false
              custom_value: false
              sort: false
        cfg_single_tap:
          name: Single-tap upper paddle behavior
          default: nc
          selector:
            select:
              mode: dropdown
              options:
              - label: No change
                value: nc
              - label: Previous brightness
                value: '0'
              - label: Custom brightness (see Custom brightness level)
                value: '1'
              - label: Configured maximum brightness
                value: '2'
              - label: Full brightness
                value: '3'
              multiple: false
              custom_value: false
              sort: false
        cfg_custom_brightness:
          name: Custom brightness level (%)
          description: -1 = no change. 0 = previous brightness. 1-99.
          default: -1
          selector:
            number:
              min: -1.0
              max: 99.0
              step: 1.0
              mode: box
              unit_of_measurement: '%'
        cfg_local_dimming_speed:
          name: Local dimming speed (seconds)
          description: -1 = no change. 1-99 seconds for a full local hold-to-dim sweep.
          default: -1
          selector:
            number:
              min: -1.0
              max: 99.0
              step: 1.0
              mode: box
              unit_of_measurement: s
        cfg_night_light:
          name: Night light mode brightness (ZEN72/ZEN77 only, %)
          description: -1 = no change. 0 = disabled. 1-99.
          default: -1
          selector:
            number:
              min: -1.0
              max: 99.0
              step: 1.0
              mode: box
              unit_of_measurement: '%'
    stepped_dimming:
      name: Stepped dimming
      icon: mdi:stairs
      collapsed: true
      input:
        step_enable:
          name: Enable stepped dimming
          description: Quantized paddle dimming between the levels below. Overrides
            the hold/release paddle actions further down. Requires Scene Control =
            Enable. Pick the style that matches the installation with the next setting.
          default: false
          selector:
            boolean: {}
        step_style:
          name: Stepped dimming style
          description: HOLD-STEP sends a discrete brightness step per pause interval
            while the paddle is held; use it only when the switch does not locally
            dim its own load (no-load or smart bulb mode), because local hold-dimming
            overrides Z-Wave steps. RELEASE-SNAP lets the hardware hold-to-dim ramp
            normally, then snaps brightness to the nearest step within the limits
            when the paddle is released; use it on load-connected dimmers.
          default: hold_step
          selector:
            select:
              mode: dropdown
              options:
              - label: Hold-step (no load / smart bulb mode)
                value: hold_step
              - label: Release-snap (connected load)
                value: release_snap
              multiple: false
              custom_value: false
              sort: false
        step_key_up:
          name: Step-UP scene key
          description: 'Scene key that steps brightness up (hold it in Hold-step style;
            releasing it snaps in Release-snap style). ZEN7x - 001: upper paddle,
            002: lower paddle. ZEN32 - 001-004: small buttons, 005: big button. ZEN35
            - 001-004: small buttons, 005: dimmer paddle.'
          default: '001'
          selector:
            select:
              mode: dropdown
              options:
              - label: 001 (upper paddle / button 1)
                value: '001'
              - label: 002 (lower paddle / button 2)
                value: '002'
              - label: 003 (button 3)
                value: '003'
              - label: 004 (button 4)
                value: '004'
              - label: 005 (big button / dimmer paddle)
                value: '005'
              multiple: false
              custom_value: false
              sort: false
        step_key_down:
          name: Step-DOWN scene key
          description: 'Scene key that steps brightness down. Same key map as above.
            Setting this to the SAME key as step-UP gives one-button stepping: holding
            steps DOWN while the light is on and UP while it is off.'
          default: '002'
          selector:
            select:
              mode: dropdown
              options:
              - label: 001 (upper paddle / button 1)
                value: '001'
              - label: 002 (lower paddle / button 2)
                value: '002'
              - label: 003 (button 3)
                value: '003'
              - label: 004 (button 4)
                value: '004'
              - label: 005 (big button / dimmer paddle)
                value: '005'
              multiple: false
              custom_value: false
              sort: false
        step_target:
          name: Light to step
          description: Light (or light group) to dim. Leave empty to use the switch's
            own light entity.
          default: []
          selector:
            entity:
              multiple: false
              domain:
