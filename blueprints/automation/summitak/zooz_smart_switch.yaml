      icon: mdi:weather-night
      collapsed: true
      input:
        turn_off_untracked:
          name: Turn off untracked small-button LEDs
          description: When on, small buttons (1-4) with no tracked entity have their
            LEDs set to Always off. The big button is governed by the LED indicator
            settings when it is not tracking an entity.
          default: false
          selector:
            boolean: {}
        night_entity:
          name: Night entity (optional)
          description: A toggle, binary_sensor, sensor or sun entity. Night is when it
            is on, below_horizon, true or night. When set, it replaces the start and
            stop times below.
          default: []
          selector:
            entity:
              multiple: false
              domain:
              - binary_sensor
              - input_boolean
              - sensor
              - sun
              reorder: false
        invert_night_entity:
          name: Invert the night entity
          description: Use when the entity above means daytime instead of night.
          default: false
          selector:
            boolean: {}
