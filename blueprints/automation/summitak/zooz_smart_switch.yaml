    follow_section:
      name: Follow light (LED / state mirror)
      icon: mdi:link-variant
      collapsed: true
      input:
        mirror_entity:
          name: Follow this light
          description: Optional. Keep this switch's on/off state (and therefore its
            LED color) in step with the selected light, whatever turns that light
            on or off. Use on a no-load ZEN7x that remotely controls a light wired
            to another switch. Leave empty to disable.
          default: ''
          selector:
            entity:
              domain:
              - light
              - switch
              multiple: false
              reorder: false
    direct_link_section:
      name: Direct links (Z-Wave association)
      icon: mdi:transit-connection-variant
      collapsed: true
      input:
        direct_link_targets:
          name: Directly control these lights
          description: Optional. Z-Wave lights (or light-like switches) this switch
            controls directly, without Home Assistant, written to its association
            group on save and at startup. For a two-way pair, list each switch in
            the other's automation. Long Range nodes are skipped. Leave empty to leave
            the switch's groups alone (default).
          default: []
          selector:
            entity:
              filter:
              - integration: zwave_js
                domain:
                - light
                - switch
              - integration: switch_as_x
                domain:
                - light
              multiple: true
              reorder: false
        direct_link_remove:
          name: Remove direct links to
          description: Optional. Lights to remove from this switch's association
            group on save and at startup. Home Assistant cannot read the groups back,
            so a link is only removed when it is listed here.
          default: []
          selector:
            entity:
              filter:
              - integration: zwave_js
                domain:
                - light
                - switch
              - integration: switch_as_x
                domain:
                - light
              multiple: true
              reorder: false
        direct_link_group:
          name: Association group
          description: 0 = automatic (group 3 dimming on ZEN72/ZEN77, group 2 on/off
            on ZEN71/ZEN76). ZEN32/ZEN35 have one group per button, so set the group
            number from the Zooz manual. Group 1 (Lifeline) is never written.
          default: 0
          selector:
            number:
              min: 0.0
              max: 20.0
              step: 1.0
              mode: box
mode: parallel
max: 10
trigger_variables:
  mirror_entity_tv: !input mirror_entity
  schedule_start: !input schedule_start
  schedule_stop: !input schedule_stop
  night_entity: !input night_entity
  schedule_set: '{{ night_entity not in [none, '''', []] or schedule_start != schedule_stop
    }}'
  inputs:
  - button_id: 0
    off_state: !input off_state0
    off_color: !input off_color0
    off_brightness: !input off_brightness0
    on_state: !input on_state0
    on_color: !input on_color0
    on_brightness: !input on_brightness0
    unavail_state: !input unavail_state0
    unavail_color: !input unavail_color0
    unavail_brightness: !input unavail_brightness0
    trigger_entity: !input input_entity0
  - button_id: 1
    off_state: !input off_state1
    off_color: !input off_color1
    off_brightness: !input off_brightness1
    on_state: !input on_state1
    on_color: !input on_color1
