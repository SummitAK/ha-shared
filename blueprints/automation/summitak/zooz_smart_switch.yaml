  - key: auto_off
    raw: !input cfg_auto_off
  - key: auto_on
    raw: !input cfg_auto_on
  - key: power_failure
    raw: !input cfg_power_failure
  - key: smart_mode
    raw: !input cfg_smart_mode
  - key: scene_control
    raw: !input cfg_scene_control
  - key: ramp_on_manual
    raw: !input cfg_ramp_on_manual
  - key: ramp_off_manual
    raw: !input cfg_ramp_off_manual
  - key: min_brightness
    raw: !input cfg_min_brightness
  - key: max_brightness
    raw: !input cfg_max_brightness
  - key: double_tap
    raw: !input cfg_double_tap
  - key: single_tap
    raw: !input cfg_single_tap
  - key: custom_brightness
    raw: !input cfg_custom_brightness
  - key: local_dimming_speed
    raw: !input cfg_local_dimming_speed
  - key: night_light
    raw: !input cfg_night_light
  - key: local_programming
    raw: !input cfg_local_programming
  - key: opposite_led
    raw: '{{ opposite_raw }}'
  step_enable: !input step_enable
  step_style: !input step_style
  step_key_up: !input step_key_up
  step_key_down: !input step_key_down
  step_target: !input step_target
  step_size: !input step_size
  step_floor: !input step_floor
  step_ceiling: !input step_ceiling
  step_target_resolved: "{% if step_target not in [none, '', []] %}\n  {{ step_target
    }}\n{% else %}\n  {{ device_entities(controller_id) | select('match', 'light\\.')
    | list\n     | first | default('') }}\n{% endif %}"
  direct_link_targets: !input direct_link_targets
  direct_link_remove: !input direct_link_remove
  direct_link_group_in: !input direct_link_group
  link_paddle_actions:
    up_1x: !input up_1x
    down_1x: !input down_1x
    up_hold: !input up_hold
    down_hold: !input down_hold
  self_node: "{% set ns = namespace(n=0) %}{% for i in device_attr(controller_id,
    'identifiers') | default([], true) %}{% if i[0] == 'zwave_js' and i[1] is match('^\\d+-\\d+$')
    %}{% set ns.n = i[1].split('-')[1] | int(0) %}{% endif %}{% endfor %}{{ ns.n }}"
  link_group: "{% set g = direct_link_group_in | int(0) %}{% if g >= 2 %}{{ g }}{%
    elif model_key in ['zen72', 'zen77'] %}3{% elif model_key in ['zen71', 'zen76']
    %}2{% else %}0{% endif %}"
  link_add_nodes: "{% set ns = namespace(n=[]) %}{% for e in (direct_link_targets
    if direct_link_targets is list else [direct_link_targets]) | reject('in', [none,
    '']) %}{% set d = device_id(e) %}{% if d %}{% for i in device_attr(d, 'identifiers')
    | default([], true) %}{% if i[0] == 'zwave_js' and i[1] is match('^\\d+-\\d+$')
    %}{% set ns.n = ns.n + [i[1].split('-')[1] | int(0)] %}{% endif %}{% endfor %}{%
    endif %}{% endfor %}{{ ns.n | unique | reject('eq', self_node | int) | reject('eq',
    0) | list }}"
  link_remove_nodes: "{% set ns = namespace(n=[]) %}{% for e in (direct_link_remove
    if direct_link_remove is list else [direct_link_remove]) | reject('in', [none,
    '']) %}{% set d = device_id(e) %}{% if d %}{% for i in device_attr(d, 'identifiers')
    | default([], true) %}{% if i[0] == 'zwave_js' and i[1] is match('^\\d+-\\d+$')
    %}{% set ns.n = ns.n + [i[1].split('-')[1] | int(0)] %}{% endif %}{% endfor %}{%
    endif %}{% endfor %}{{ ns.n | unique | reject('in', link_add_nodes) | reject('eq',
    0) | list }}"
  link_lr_skipped: '{{ (link_add_nodes + link_remove_nodes) | select(''ge'', 256)
    | list if self_node | int < 256 else link_add_nodes + link_remove_nodes }}'
  link_dup_entities: "{% set txt = (link_paddle_actions | string) ~ ' ' ~ (step_target_resolved
    if step_enable else '') %}{{ (direct_link_targets if direct_link_targets is list
    else [direct_link_targets]) | reject('in', [none, '']) | select('in', txt) | list
    }}"
  is_scene_ctl: "{{ model_key in ['zen32', 'zen35'] }}"
  big_tracked: "{{ is_scene_ctl and inputs[0].trigger_entity not in [none, '', []] }}"
  led_skip_keys: "{{ ['led_mode', 'led_color', 'led_brightness'] if big_tracked else
    [] }}"
  cfg_p20: !input cfg_disabled_load_behavior
  brightness_map: '{{ brightness_map_new if led_scale_new else brightness_map_legacy
    }}'
  toggle_offset: 1
  color_offset: 6
  brightness_offset: 11
  night_led_brightness_input: !input night_led_brightness
  night_brightness_override: '{{ (night_led_brightness_input | string) != ''99'' }}'
  night_led_brightness: '{{ brightness_map.get(night_led_brightness_input | string,
    brightness_map[''medium'']) }}'
  night_led_color: !input night_led_color
  invert_night_entity: !input invert_night_entity
  turn_off_untracked: !input turn_off_untracked
  on_states:
  - 'on'
  - open
  - opening
  - 'true'
  - 'True'
  - true
  - playing
  - heat
  - cold
  - dry
  - armed_home
  - armed_away
  - armed_vacation
  - armed_night
  - armed_custom_bypass
  - triggered
  - pending
  - arming
  - unlocked
  - 1
  - home
  - active
  off_states:
  - 'off'
  - closed
  - closing
  - 'false'
  - 'False'
  - false
  - standby
  - paused
  - idle
  - disarmed
  - disarming
  - locked
  - not_home
  - away
  night_states:
  - 'on'
  - below_horizon
  - 'True'
  - 'true'
  - night
  - Night
  valid_buttons: '{{ inputs | rejectattr(''trigger_entity'', ''in'', [none, '''',
    []]) | list if is_scene_ctl else [] }}'
  untracked_buttons: '{{ inputs | selectattr(''trigger_entity'', ''in'', [none, '''',
    []]) | rejectattr(''button_id'', ''eq'', 0) | list if is_scene_ctl else [] }}'
  in_nighttime: "{% if night_entity not in [none, '', []] %}\n  {% set is_night =
    states(night_entity) in night_states %}\n  {{ not is_night if invert_night_entity
    else is_night }}\n{% else %}\n  {% set time_now = (now() + timedelta(seconds=2)).strftime('%H:%M:%S')
    %}\n  {% if schedule_start < schedule_stop %}\n    {{ schedule_set and (schedule_start
    <= time_now < schedule_stop) }}\n  {% else %}\n    {{ schedule_set and (schedule_start
    <= time_now or time_now < schedule_stop) }}\n  {% endif %}\n{% endif %}\n"
triggers:
- alias: ButtonPress
  id: ButtonPress
  trigger: event
  event_type: zwave_js_value_notification
  event_data:
    device_id: !input zooz_switch
    command_class_name: Central Scene
- alias: HassStart
  id: HassStart
  trigger: homeassistant
  event: start
- alias: AutomationUpdate
  id: AutomationUpdate
  trigger: event
  event_type: automation_reloaded
- alias: Followed light changed
  id: MirrorState
  trigger: event
  event_type: state_changed
  event_data:
    entity_id: !input mirror_entity
  enabled: '{{ mirror_entity_tv not in [none, ''''] }}'
- alias: Night entity changed
  id: EntityToggle
  trigger: state
  entity_id: !input night_entity
  enabled: '{{ night_entity not in [none, '''', []] }}'
- alias: NightTime
  id: NightTime
  trigger: time
  at: !input schedule_start
  enabled: '{{ night_entity in [none, '''', []] and schedule_set }}'
- alias: DayTime
  id: DayTime
  trigger: time
  at: !input schedule_stop
  enabled: '{{ night_entity in [none, '''', []] and schedule_set }}'
- alias: '0'
  id: StateTrigger
  trigger: state
  entity_id: !input input_entity0
  enabled: '{{ inputs[0].trigger_entity not in [none, '''', []] }}'
- alias: '1'
  id: StateTrigger
  trigger: state
  entity_id: !input input_entity1
  enabled: '{{ inputs[1].trigger_entity not in [none, '''', []] }}'
- alias: '2'
  id: StateTrigger
  trigger: state
  entity_id: !input input_entity2
  enabled: '{{ inputs[2].trigger_entity not in [none, '''', []] }}'
- alias: '3'
  id: StateTrigger
  trigger: state
  entity_id: !input input_entity3
  enabled: '{{ inputs[3].trigger_entity not in [none, '''', []] }}'
- alias: '4'
  id: StateTrigger
  trigger: state
  entity_id: !input input_entity4
  enabled: '{{ inputs[4].trigger_entity not in [none, '''', []] }}'
actions:
- choose:
  - alias: Handle a button event
    conditions: '{{ trigger.id == ''ButtonPress'' }}'
    sequence:
    - variables:
        raw_v: '{{ trigger.event.data.value }}'
        key: '{{ trigger.event.data.property_key_name }}'
        value: "{% set m = {'0': 'KeyPressed', '1': 'KeyHeldDown',\n            '2':
          'KeyReleased', '3': 'KeyPressed2x',\n            '4': 'KeyPressed3x', '5':
          'KeyPressed4x',\n            '6': 'KeyPressed5x'} %}\n{{ m[raw_v | string]
          if (raw_v | string) in m else raw_v }}"
    - alias: Log the event when debug logging is on
      enabled: !input debug_logging
      action: logbook.log
      data:
        name: Zooz Smart Switch
        message: '{{ device_model }} event: key {{ key }} - {{ value }}'
    - choose:
      - alias: 'Stepped dimming: hold the step-up key steps brightness up'
        conditions: "{{ step_enable and step_style == 'hold_step'\n   and key == step_key_up
          and value == 'KeyHeldDown'\n   and step_target_resolved != ''\n   and (step_key_up
          != step_key_down\n        or not is_state(step_target_resolved, 'on')) }}"
        sequence:
        - variables:
            cur_pct: "{% if is_state(step_target_resolved, 'on') %}\n  {{ ((state_attr(step_target_resolved,
              'brightness')\n      | int(0)) / 255 * 100) | round(0) }}\n{% else %}\n
              \ 0\n{% endif %}"
            start_pct: "{% set r = ((cur_pct | int(0)) / step_size)\n   | round(0,
              'common') * step_size %}\n{% if cur_pct | int(0) < step_floor | int
              %}\n  {{ step_floor | int - step_size | int }}\n{% else %}\n  {{ r |
              int }}\n{% endif %}"
        - repeat:
            sequence:
            - variables:
                tgt: "{{ [start_pct | int + repeat.index * step_size | int,\n    step_ceiling
                  | int] | min }}"
            - action: light.turn_on
              continue_on_error: true
              target:
                entity_id: '{{ step_target_resolved }}'
              data:
                brightness_pct: '{{ tgt }}'
                transition: 0
            - wait_for_trigger:
              - trigger: event
                event_type: zwave_js_value_notification
                event_data:
                  device_id: !input zooz_switch
                  command_class_name: Central Scene
                  property_key_name: !input step_key_up
              timeout:
                milliseconds: !input step_pause_ms
              continue_on_timeout: true
            until: "{{ wait.trigger is not none\n   or [start_pct | int + repeat.index
              * step_size | int,\n       step_ceiling | int] | min >= step_ceiling
              | int\n   or repeat.index >= 25 }}"
      - alias: 'Stepped dimming: hold the step-down key steps brightness down'
        conditions: "{{ step_enable and step_style == 'hold_step'\n   and key == step_key_down
          and value == 'KeyHeldDown'\n   and step_target_resolved != ''\n   and is_state(step_target_resolved,
          'on') }}"
        sequence:
        - variables:
            cur_pct: "{{ ((state_attr(step_target_resolved, 'brightness')\n    | int(0))
              / 255 * 100) | round(0) }}"
            start_pct: "{{ (((cur_pct | int(0)) / step_size)\n   | round(0, 'common')
              * step_size) | int }}"
        - repeat:
            sequence:
            - variables:
                tgt: "{{ [start_pct | int - repeat.index * step_size | int,\n    step_floor
                  | int] | max }}"
            - action: light.turn_on
              continue_on_error: true
              target:
                entity_id: '{{ step_target_resolved }}'
              data:
                brightness_pct: '{{ tgt }}'
                transition: 0
            - wait_for_trigger:
              - trigger: event
                event_type: zwave_js_value_notification
                event_data:
                  device_id: !input zooz_switch
                  command_class_name: Central Scene
                  property_key_name: !input step_key_down
              timeout:
                milliseconds: !input step_pause_ms
              continue_on_timeout: true
            until: "{{ wait.trigger is not none\n   or [start_pct | int - repeat.index
              * step_size | int,\n       step_floor | int] | max <= step_floor | int\n
              \  or repeat.index >= 25 }}"
      - alias: 'Stepped dimming: snap to nearest step on release'
        conditions: "{{ step_enable and step_style == 'release_snap'\n   and value
          == 'KeyReleased'\n   and key in [step_key_up, step_key_down]\n   and step_target_resolved
          != '' }}"
        sequence:
        - alias: Let the final hardware brightness report arrive
          delay:
            milliseconds: 300
        - condition: template
          value_template: '{{ is_state(step_target_resolved, ''on'') }}'
        - variables:
            cur_pct: "{{ ((state_attr(step_target_resolved, 'brightness')\n    | int(0))
              / 255 * 100) | round(0) }}"
            snap_pct: "{{ [[(((cur_pct | int(0)) / step_size)\n      | round(0, 'common')
              * step_size) | int,\n     step_floor | int] | max,\n    step_ceiling
              | int] | min }}"
        - action: light.turn_on
          continue_on_error: true
          target:
            entity_id: '{{ step_target_resolved }}'
          data:
            brightness_pct: '{{ snap_pct }}'
            transition: 0
      - conditions: '{{ key == ''001'' and value == ''KeyPressed'' }}'
        sequence: !input up_1x
      - conditions: '{{ key == ''001'' and value == ''KeyPressed2x'' }}'
        sequence: !input up_2x
      - conditions: '{{ key == ''001'' and value == ''KeyPressed3x'' }}'
        sequence: !input up_3x
      - conditions: '{{ key == ''001'' and value == ''KeyPressed4x'' }}'
        sequence: !input up_4x
      - conditions: '{{ key == ''001'' and value == ''KeyPressed5x'' }}'
        sequence: !input up_5x
      - conditions: "{{ key == '001' and value == 'KeyHeldDown'\n   and not (step_enable and key in [step_key_up, step_key_down])
          }}"
        sequence: !input up_hold
      - conditions: "{{ key == '001' and value == 'KeyReleased'\n   and not (step_enable and key in [step_key_up, step_key_down])
          }}"
        sequence: !input up_release
      - conditions: '{{ key == ''002'' and value == ''KeyPressed'' }}'
        sequence: !input down_1x
      - conditions: '{{ key == ''002'' and value == ''KeyPressed2x'' }}'
        sequence: !input down_2x
      - conditions: '{{ key == ''002'' and value == ''KeyPressed3x'' }}'
        sequence: !input down_3x
      - conditions: '{{ key == ''002'' and value == ''KeyPressed4x'' }}'
        sequence: !input down_4x
      - conditions: '{{ key == ''002'' and value == ''KeyPressed5x'' }}'
        sequence: !input down_5x
      - conditions: "{{ key == '002' and value == 'KeyHeldDown'\n   and not (step_enable and key in [step_key_up, step_key_down])
          }}"
        sequence: !input down_hold
      - conditions: "{{ key == '002' and value == 'KeyReleased'\n   and not (step_enable and key in [step_key_up, step_key_down])
          }}"
        sequence: !input down_release
      - conditions: '{{ key == ''003'' and value == ''KeyPressed'' }}'
        sequence: !input button3_1x
      - conditions: '{{ key == ''003'' and value == ''KeyPressed2x'' }}'
        sequence: !input button3_2x
      - conditions: '{{ key == ''003'' and value == ''KeyPressed3x'' }}'
        sequence: !input button3_3x
      - conditions: '{{ key == ''003'' and value == ''KeyPressed4x'' }}'
        sequence: !input button3_4x
      - conditions: '{{ key == ''003'' and value == ''KeyPressed5x'' }}'
        sequence: !input button3_5x
      - conditions: "{{ key == '003' and value == 'KeyHeldDown'\n   and not (step_enable and key in [step_key_up, step_key_down])
          }}"
        sequence: !input button3_hold
      - conditions: "{{ key == '003' and value == 'KeyReleased'\n   and not (step_enable and key in [step_key_up, step_key_down])
          }}"
        sequence: !input button3_release
      - conditions: '{{ key == ''004'' and value == ''KeyPressed'' }}'
        sequence: !input button4_1x
      - conditions: '{{ key == ''004'' and value == ''KeyPressed2x'' }}'
        sequence: !input button4_2x
      - conditions: '{{ key == ''004'' and value == ''KeyPressed3x'' }}'
        sequence: !input button4_3x
      - conditions: '{{ key == ''004'' and value == ''KeyPressed4x'' }}'
        sequence: !input button4_4x
      - conditions: '{{ key == ''004'' and value == ''KeyPressed5x'' }}'
        sequence: !input button4_5x
      - conditions: "{{ key == '004' and value == 'KeyHeldDown'\n   and not (step_enable and key in [step_key_up, step_key_down])
          }}"
        sequence: !input button4_hold
      - conditions: "{{ key == '004' and value == 'KeyReleased'\n   and not (step_enable and key in [step_key_up, step_key_down])
          }}"
        sequence: !input button4_release
      - conditions: '{{ key == ''005'' and value == ''KeyPressed'' }}'
        sequence: !input button5_1x
      - conditions: '{{ key == ''005'' and value == ''KeyPressed2x'' }}'
        sequence: !input button5_2x
      - conditions: '{{ key == ''005'' and value == ''KeyPressed3x'' }}'
        sequence: !input button5_3x
      - conditions: '{{ key == ''005'' and value == ''KeyPressed4x'' }}'
        sequence: !input button5_4x
      - conditions: '{{ key == ''005'' and value == ''KeyPressed5x'' }}'
        sequence: !input button5_5x
      - conditions: "{{ key == '005' and value == 'KeyHeldDown'\n   and not (step_enable and key in [step_key_up, step_key_down])
          }}"
        sequence: !input button5_hold
      - conditions: "{{ key == '005' and value == 'KeyReleased'\n   and not (step_enable and key in [step_key_up, step_key_down])
          }}"
        sequence: !input button5_release
      - conditions: '{{ key == ''006'' and value == ''KeyPressed'' }}'
        sequence: !input button6_1x
      - conditions: '{{ key == ''006'' and value == ''KeyPressed2x'' }}'
        sequence: !input button6_2x
      - conditions: '{{ key == ''006'' and value == ''KeyPressed3x'' }}'
        sequence: !input button6_3x
      - conditions: '{{ key == ''006'' and value == ''KeyPressed4x'' }}'
        sequence: !input button6_4x
      - conditions: '{{ key == ''006'' and value == ''KeyPressed5x'' }}'
        sequence: !input button6_5x
      - conditions: '{{ key == ''006'' and value == ''KeyHeldDown'' }}'
        sequence: !input button6_hold
      - conditions: '{{ key == ''006'' and value == ''KeyReleased'' }}'
        sequence: !input button6_release
  - alias: LED tracking - a tracked entity changed (ZEN32/ZEN35)
    conditions: "{{ trigger.id == 'StateTrigger' and is_scene_ctl\n   and trigger.to_state
      is not none\n   and (trigger.from_state is none\n        or trigger.to_state.state
      != trigger.from_state.state) }}"
    sequence:
    - alias: Let rapid toggles settle, then use the entity's current state
      delay:
        milliseconds: 250
    - &controller_ready
      alias: Wait until the switch is reachable (stop quietly if it never is)
      sequence:
      - wait_template: "{{ (device_attr(controller_id, 'config_entries') | default([],
          true) | list\n    | map('config_entry_attr', 'state') | map('string')\n    |
          select('eq', 'loaded') | list | count > 0)\n   and (self_entity == ''\n        or
          states(self_entity) not in ['unavailable', 'unknown']) }}"
        timeout: 00:02:00
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ not wait.completed }}'
        then:
        - action: logbook.log
          continue_on_error: true
          data:
            name: Zooz Smart Switch
            message: '{{ device_model }} was not reachable for 2 minutes; nothing was
              written.'
        - stop: Switch not reachable
    - variables:
        current: '{{ inputs[trigger.alias | int] }}'
        target_state: '{{ states(current.trigger_entity) }}'
        prev_state: '{{ trigger.from_state.state if trigger.from_state is not none
          else ''unknown'' }}'
    - variables: &led_vars
        map_b_off: '{{ brightness_map.get(current.off_brightness | string, brightness_map[''medium''])
          }}'
        map_b_on: '{{ brightness_map.get(current.on_brightness | string, brightness_map[''medium''])
          }}'
        map_b_unavail: '{{ brightness_map.get(current.unavail_brightness | string,
          brightness_map[''medium'']) }}'
        led_cond: "{% if target_state in off_states %}\n  {{ dict(state=current.off_state,
          color=current.off_color, brightness=map_b_off) }}\n{% elif target_state
          in on_states %}\n  {{ dict(state=current.on_state, color=current.on_color,
          brightness=map_b_on) }}\n{% elif target_state == \"unavailable\" %}\n  {{
          dict(state=current.unavail_state, color=current.unavail_color, brightness=map_b_unavail)
          }}\n{% else %}\n  {{ dict(state=None, color=None, brightness=None) }}\n{%
          endif %}\n"
        parameter:
          toggle: '{{ current.button_id | int + toggle_offset | int }}'
          color: '{{ current.button_id | int + color_offset | int }}'
          brightness: '{{ current.button_id | int + brightness_offset | int }}'
    - variables:
        prev_cond: "{% if prev_state in off_states %}\n  {{ dict(state=current.off_state,
          color=current.off_color, brightness=map_b_off) }}\n{% elif prev_state in
          on_states %}\n  {{ dict(state=current.on_state, color=current.on_color,
          brightness=map_b_on) }}\n{% elif prev_state == \"unavailable\" %}\n  {{
          dict(state=current.unavail_state, color=current.unavail_color, brightness=map_b_unavail)
          }}\n{% else %}\n  {{ dict(state=None, color=None, brightness=None) }}\n{%
          endif %}\n"
        night_active: '{{ (schedule_set and in_nighttime) | bool }}'
    - variables:
        want: "{% set c = led_cond %} {{ dict(\n     toggle=((('2' if night_active
          else '3') if (c.state | string) == '99' else c.state) | string),\n     color=((night_led_color
          if ((night_led_color | string) != '99' and night_active) else c.color) |
          string),\n     brightness=((night_led_brightness if (night_brightness_override
          and night_active) else c.brightness) | string)) }}\n"
        had: "{% set c = prev_cond %} {% if c.state is none %}\n  {{ dict(toggle='none',
          color='none', brightness='none') }}\n{% else %}\n  {{ dict(\n       toggle=((('2'
          if night_active else '3') if (c.state | string) == '99' else c.state) |
          string),\n       color=((night_led_color if ((night_led_color | string)
          != '99' and night_active) else c.color) | string),\n       brightness=((night_led_brightness
          if (night_brightness_override and night_active) else c.brightness) | string))
          }}\n{% endif %}\n"
    - alias: Write only the LED parameters that changed
      if:
      - condition: template
        value_template: '{{ led_cond.state is not none }}'
      then:
      - if:
        - condition: template
          value_template: '{{ had.toggle != want.toggle }}'
        then:
        - action: zwave_js.set_config_parameter
          continue_on_error: true
          data:
            parameter: '{{ parameter.toggle }}'
            value: '{{ want.toggle }}'
          target:
            device_id: '{{ controller_id }}'
        - delay:
            milliseconds: 300
      - if:
        - condition: template
          value_template: '{{ had.color != want.color }}'
        then:
        - action: zwave_js.set_config_parameter
          continue_on_error: true
          data:
            parameter: '{{ parameter.color }}'
            value: '{{ want.color }}'
          target:
            device_id: '{{ controller_id }}'
        - delay:
            milliseconds: 300
      - if:
        - condition: template
          value_template: '{{ had.brightness != want.brightness }}'
        then:
        - action: zwave_js.set_config_parameter
          continue_on_error: true
          data:
            parameter: '{{ parameter.brightness }}'
            value: '{{ want.brightness }}'
          target:
            device_id: '{{ controller_id }}'
  - alias: LED tracking - night started or ended (ZEN32/ZEN35)
    conditions: "{{ is_scene_ctl and (\n  (trigger.id in ['NightTime', 'DayTime'] and
      schedule_set) or\n  (trigger.id == 'EntityToggle' and schedule_set\n   and trigger.to_state
      is not none\n   and (trigger.from_state is none\n        or trigger.to_state.state
      != trigger.from_state.state))) }}"
    sequence:
    - *controller_ready
    - &untracked_off
      alias: Turn off untracked small-button LEDs
      if:
      - condition: template
        value_template: '{{ turn_off_untracked and untracked_buttons | length > 0
          }}'
      then:
      - repeat:
          for_each: '{{ untracked_buttons }}'
          sequence:
          - action: zwave_js.set_config_parameter
            continue_on_error: true
            data:
              parameter: '{{ repeat.item.button_id | int + toggle_offset | int }}'
              value: 2
            target:
              device_id: '{{ controller_id }}'
          - delay:
              milliseconds: 300
    - &led_refresh
      alias: Refresh every tracked LED
      repeat:
        for_each: '{{ valid_buttons }}'
        sequence:
        - variables:
            current: '{{ repeat.item }}'
            target_state: '{{ states(repeat.item.trigger_entity) }}'
        - variables: *led_vars
        - if:
          - condition: template
            value_template: '{{ led_cond.state is not none }}'
          then:
          - action: zwave_js.set_config_parameter
            continue_on_error: true
            data:
              parameter: '{{ parameter.toggle }}'
              value: "{% if (led_cond.state | string) == '99' %}\n  {{ '2' if schedule_set
                and in_nighttime else '3' }}\n{% else %}\n  {{ led_cond.state }}\n{%
                endif %}\n"
            target:
              device_id: '{{ controller_id }}'
          - delay:
              milliseconds: 300
          - action: zwave_js.set_config_parameter
            continue_on_error: true
            data:
              parameter: '{{ parameter.color }}'
              value: "{% if (night_led_color | string) != '99' and in_nighttime and schedule_set
                %}\n  {{ night_led_color }}\n{% else %}\n  {{ led_cond.color }}\n{%
                endif %}\n"
            target:
              device_id: '{{ controller_id }}'
          - delay:
              milliseconds: 300
          - action: zwave_js.set_config_parameter
            continue_on_error: true
            data:
              parameter: '{{ parameter.brightness }}'
              value: '{{ night_led_brightness if (night_brightness_override and in_nighttime
                and schedule_set) else led_cond.brightness }}'
            target:
              device_id: '{{ controller_id }}'
        - delay:
            milliseconds: 300
  - alias: Follow light - mirror its on/off state onto this switch
    conditions: '{{ trigger.id == ''MirrorState'' and mirror_entity not in [none,
      ''''] and self_entity != '''' and trigger.event.data.new_state is not none and
      trigger.event.data.new_state.state in [''on'', ''off''] and (trigger.event.data.old_state
      is none or trigger.event.data.old_state.state != trigger.event.data.new_state.state)
      and not is_state(self_entity, trigger.event.data.new_state.state) }}'
    sequence:
    - variables:
        target_state: '{{ trigger.event.data.new_state.state }}'
    - if:
      - condition: template
        value_template: '{{ target_state == ''on'' }}'
      then:
      - action: homeassistant.turn_on
        continue_on_error: true
        target:
          entity_id: '{{ self_entity }}'
      else:
      - action: homeassistant.turn_off
        continue_on_error: true
        target:
          entity_id: '{{ self_entity }}'
    - alias: Log the mirror action when debug logging is on
      enabled: !input debug_logging
      action: logbook.log
      data:
        name: Zooz Smart Switch
        message: '{{ device_model }}: followed {{ mirror_entity }} -> {{ target_state
          }}'
  - alias: Apply configuration parameters to the switch
    conditions: "{{ trigger.id == 'HassStart'\n   or (trigger.id == 'AutomationUpdate'
      and this is defined\n       and (as_timestamp(now())\n            - as_timestamp(this.last_changed,
      0)) < 15) }}"
    sequence:
    - alias: Give the Z-Wave network time to come up after a restart
      if:
      - condition: template
        value_template: '{{ trigger.id == ''HassStart'' }}'
      then:
      - delay: 00:01:00
    - *controller_ready
    - variables:
        model_params: '{{ param_map.get(model_key, {}) }}'
        pending: "{{ cfg_items\n   | selectattr('key', 'in', model_params.keys() |
          list)\n   | rejectattr('raw', 'in', ['nc', -1, '-1', -1.0])\n   | rejectattr('key',
          'in', led_skip_keys)\n   | list }}"
    - repeat:
        for_each: '{{ pending }}'
        sequence:
        - variables:
            item_key: '{{ repeat.item.key }}'
            item_raw: '{{ repeat.item.raw }}'
            item_param: '{{ model_params[item_key] }}'
            item_value: "{% if item_key == 'led_color' %}\n  {% if is_extended_color
              %}\n    {{ item_raw | int }}\n  {% else %}\n    {{ color_fold_map[item_raw
              | string] | int }}\n  {% endif %}\n{% elif item_key == 'led_brightness'
              %}\n  {{ (brightness_map_new if led_scale_new\n      else brightness_map_legacy)[item_raw
              | string]\n     | int }}\n{% elif item_key == 'power_failure' %}\n  {{
              (power_map_zen32 if model_key == 'zen32'\n      else power_map_std)[item_raw
              | string] | int }}\n{% elif item_key == 'scene_control' %}\n  {{ (scene_map_zen32
              if model_key == 'zen32'\n      else scene_map_std)[item_raw | string]
              | int }}\n{% elif item_key == 'local_programming' %}\n  {{ local_programming_map[item_raw
              | string] | int }}\n{% elif item_key == 'opposite_led' %}\n  {{ opposite_led_map[item_raw
              | string] | int }}\n{% else %}\n  {{ item_raw | int }}\n{% endif %}"
        - action: zwave_js.set_config_parameter
          continue_on_error: true
          data:
            parameter: '{{ item_param }}'
            value: '{{ item_value | int }}'
          target:
            device_id: '{{ controller_id }}'
        - delay:
            milliseconds: 300
    - alias: Log applied settings when debug logging is on
      enabled: !input debug_logging
      action: logbook.log
      data:
        name: Zooz Smart Switch
        message: "Applied {{ pending | length }} configuration parameter(s) to {{
          device_model }} ({{ model_key }}){{\n  ' [panel ' ~ breaker_panel ~ ', breaker
          ' ~ breaker_circuit\n  ~ ']' if breaker_panel or breaker_circuit else ''
          }}."
    - alias: ZEN32/ZEN35 - disabled load behavior, untracked LEDs and tracked LEDs
      if:
      - condition: template
        value_template: '{{ is_scene_ctl }}'
      then:
      - if:
        - condition: template
          value_template: '{{ cfg_p20 != ''nc'' }}'
        then:
        - action: zwave_js.set_config_parameter
          continue_on_error: true
          data:
            parameter: 20
            value: '{{ cfg_p20 | int }}'
          target:
            device_id: '{{ controller_id }}'
        - delay:
            milliseconds: 300
      - *untracked_off
      - *led_refresh
    - alias: Direct links - write this switch's association group
      if:
      - condition: template
        value_template: '{{ (link_add_nodes | length > 0 or link_remove_nodes | length
          > 0 or link_lr_skipped | length > 0) }}'
      then:
      - variables:
          add_ok: '{{ link_add_nodes | reject(''in'', link_lr_skipped) | list }}'
          remove_ok: '{{ link_remove_nodes | reject(''in'', link_lr_skipped) | list
            }}'
      - if:
        - condition: template
          value_template: '{{ link_group | int(0) < 2 }}'
        then:
        - action: logbook.log
          data:
            name: Zooz Smart Switch
            message: 'Direct links NOT written on {{ device_model }} (node {{ self_node
              }}): set the association group number for this model.'
          continue_on_error: true
      - alias: Remove listed links first
        if:
        - condition: template
          value_template: '{{ link_group | int(0) >= 2 and remove_ok | length > 0
            }}'
        then:
        - action: zwave_js.invoke_cc_api
          continue_on_error: true
          target:
            device_id: '{{ controller_id }}'
          data:
            command_class: 133
            method_name: removeNodeIds
            parameters:
            - groupId: '{{ link_group | int }}'
              nodeIds: '{{ remove_ok }}'
        - delay:
            milliseconds: 500
      - alias: Add listed links (re-adding an existing link is harmless)
        if:
        - condition: template
          value_template: '{{ link_group | int(0) >= 2 and add_ok | length > 0 }}'
        then:
        - action: zwave_js.invoke_cc_api
          continue_on_error: true
          target:
            device_id: '{{ controller_id }}'
          data:
            command_class: 133
            method_name: addNodeIds
            parameters: '{{ [link_group | int] + add_ok }}'
      - if:
        - condition: template
          value_template: '{{ link_group | int(0) >= 2 }}'
        then:
        - action: logbook.log
          continue_on_error: true
          data:
            name: Zooz Smart Switch
            message: "Direct links on {{ device_model }} (node {{ self_node }}), group
              {{ link_group }}: linked {{ add_ok if add_ok else 'none' }}{{ '; removed
              ' ~ remove_ok if remove_ok else '' }}{{ '; skipped Long Range ' ~ link_lr_skipped
              if link_lr_skipped else '' }}{{ '; WARNING: 1x/hold or stepped actions
              also target ' ~ (link_dup_entities | join(', ')) ~ ', so it gets two commands'
              if link_dup_entities else '' }}."
    - alias: Follow light - re-sync this switch to the followed light
      if:
      - condition: template
        value_template: '{{ mirror_entity not in [none, ''''] and self_entity != ''''
          and states(mirror_entity) in [''on'', ''off''] and not is_state(self_entity,
          states(mirror_entity)) }}'
      then:
      - if:
        - condition: template
          value_template: '{{ is_state(mirror_entity, ''on'') }}'
        then:
        - action: homeassistant.turn_on
          continue_on_error: true
          target:
            entity_id: '{{ self_entity }}'
        else:
        - action: homeassistant.turn_off
          continue_on_error: true
          target:
            entity_id: '{{ self_entity }}'
